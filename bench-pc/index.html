<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench PC · plan d'achat 4K</title>
<meta name="description" content="Plan d'achat pour passer au 4K en gardant l'i5-14600KF : trois paliers RTX 5070 Ti, 5080 et 5090, prix en stock et bons plans.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bench PC">
<style>
:root{--bg:#0c0d10;--card:#16181d;--card2:#1c1f26;--line:#2a2e37;--fg:#f4f5f7;--mute:#9aa0ab;--a1:#8fd3ff;--a2:#b9a6ff;--a3:#ffb877;--ok:#6ee7a8;--warn:#ff8a7a;
--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(40px + var(--safe-b))}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
/* fond */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(50% 40% at 15% 0%,rgba(143,211,255,.16),transparent 70%),
radial-gradient(45% 40% at 95% 20%,rgba(185,166,255,.14),transparent 70%),
radial-gradient(50% 40% at 50% 100%,rgba(255,184,119,.08),transparent 70%)}
.bgfx:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:26px 26px;mask-image:linear-gradient(#000,transparent 85%)}

header{padding:calc(34px + var(--safe-t)) 0 8px}
.kick{display:inline-flex;gap:8px;align-items:center;font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:rgba(255,255,255,.03)}
.kick i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.kick i.off{background:var(--a3);box-shadow:0 0 10px var(--a3)}
h1{font-size:clamp(34px,8vw,64px);line-height:1.02;letter-spacing:-.04em;font-weight:800;margin:16px 0 8px}
h1 span{background:linear-gradient(90deg,var(--a1),var(--a2) 55%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--mute);max-width:620px}
h2{font-size:clamp(24px,5vw,34px);letter-spacing:-.03em;font-weight:700;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 20px}
main{padding-top:20px;padding-bottom:calc(110px + var(--safe-b))}
.view{display:none}.view.on{display:block;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,15,19,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.tabbar div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabbar button{appearance:none;background:none;border:0;color:var(--mute);font:600 11px/1.1 inherit;padding:8px 2px 6px;border-radius:12px;display:grid;gap:4px;justify-items:center;cursor:pointer;transition:.2s}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--fg);background:var(--card2)}
.tabbar button.on svg{stroke:var(--a1)}
/* cartes */
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.pill{display:inline-block;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:99px}
.pill.garde{background:rgba(110,231,168,.12);color:var(--ok)}.pill.change{background:rgba(255,184,119,.14);color:var(--a3)}
.pill.bad{background:rgba(255,138,122,.14);color:var(--warn)}.pill.good{background:rgba(110,231,168,.12);color:var(--ok)}.pill.mid{background:rgba(255,184,119,.14);color:var(--a3)}
.cfg h3{font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
.cfg b{font-size:19px;letter-spacing:-.01em}.cfg p{color:var(--mute);font-size:14px;margin-top:4px}
.cfg .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 14px/1 inherit;padding:11px 15px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:.2s}
.seg button.on{background:var(--fg);color:#0c0d10;border-color:transparent}
.seg.pal button.on{color:#0c0d10}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs .c{padding:14px;border-radius:16px;background:#101217;border:1px solid var(--line)}
.vs .c small{color:var(--mute);font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.vs .c b{display:block;margin:6px 0 2px;font-size:16px;line-height:1.3}
.vs .c.t{border-color:rgba(143,211,255,.4)}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.small{font-size:13px}
.price-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;flex-wrap:wrap}
a.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:12px;background:var(--fg);color:#0c0d10;font-weight:700;font-size:14px;text-decoration:none}
a.lnk{color:var(--a1);text-decoration:none}
.track{height:14px;background:#101217;border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.fill{height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.br{display:grid;grid-template-columns:104px 1fr 56px;gap:10px;align-items:center;font-size:14px;margin:12px 0}
.br .v{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}.br .nm{font-weight:600}
.note{margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,184,119,.3);background:rgba(255,184,119,.06);color:#ffd6b0;font-size:14px}
.ok{border-color:rgba(110,231,168,.3);background:rgba(110,231,168,.06);color:#bff3d8}
.bad{border-color:rgba(255,138,122,.4);background:rgba(255,138,122,.07);color:#ffc0b8}
.row2{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;align-items:flex-start}
.row2:first-child{border-top:0}.row2 .r{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.delta.dn{color:var(--ok)}.delta.up{color:var(--warn)}
.gauge{display:grid;gap:8px}
.gauge .lab{display:flex;justify-content:space-between;font-size:14px}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#101217;margin-top:10px;font-size:14px}
.verdict b{display:block;font-size:15px;margin-bottom:2px}
.brow{display:grid;grid-template-columns:1fr repeat(3,minmax(0,1fr));gap:10px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:14px;margin-top:8px}
.brow.h{background:none;border:0;padding-block:0;color:var(--mute);font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:640px){.brow{grid-template-columns:1fr 1fr 1fr}.brow .jeu{grid-column:1/-1;font-weight:600}.brow.h .jeu{display:none}.vs{grid-template-columns:1fr}}
footer{margin-top:28px;color:var(--mute);font-size:13px;text-align:center}
@media(prefers-reduced-motion:reduce){.view.on{animation:none}.fill{transition:none}}
</style>
</head>
<body>
<div class="bgfx"></div>
<header><div class="wrap">
  <span class="kick"><i id="dot"></i><span id="maj">Chargement…</span></span>
  <h1>Bench <span>PC</span></h1>
  <p class="lede">Ce que j'ai, ce que je dois avoir, et ce qui freine ma config pour le 4K.</p>
</div></header>
<main class="wrap">
  <section class="view" id="v-config"></section>
  <section class="view" id="v-objectif"></section>
  <section class="view" id="v-compo"></section>
  <section class="view" id="v-bench"></section>
  <section class="view" id="v-goulot"></section>
  <section class="view" id="v-prix"></section>
  <footer>Les stocks et les prix changent vite : vérifie-les avant commande.</footer>
</main>
<div class="tabbar"><div id="tabbar"></div></div>
<script src="data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")})</script>
</body>
</html>
